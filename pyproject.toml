[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "24gb-and-a-dream"
version = "0.1.0"
description = "Local-first AI video orchestration for a 24 GB GPU"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2",
  "Pillow>=11,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
